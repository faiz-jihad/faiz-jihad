name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *"  # Setiap 12 jam
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Generate Pacman
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-grid-snake.svg?palette=github-light&color_snake=#FFFF00&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            dist/pacman-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFFF00&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update pacman animation [skip ci]"
